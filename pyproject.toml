[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftflow"
version = "0.5.0"
description = "League of Legends coaching desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
# 서버 전용. 데스크톱 앱만 쓰는 사람은 설치하지 않아도 된다. httpx는 서버 테스트용.
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
riftflow = "ui.__main__:main"

[tool.setuptools.package-data]
ui = ["demo_documents.json"]
