[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftflow"
version = "0.1.0"
description = "League of Legends coaching desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]
